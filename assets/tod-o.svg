<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bg)" stroke="#313244" stroke-width="2"/>
  <!-- Checkbox lines -->
  <!-- Line 1 - checked -->
  <rect x="20" y="28" width="18" height="18" rx="4" fill="none" stroke="#a6e3a1" stroke-width="2.5"/>
  <polyline points="24,37 28,42 38,30" fill="none" stroke="#a6e3a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="46" y="32" width="62" height="10" rx="3" fill="#45475a"/>
  <!-- Line 2 - checked -->
  <rect x="20" y="55" width="18" height="18" rx="4" fill="none" stroke="#a6e3a1" stroke-width="2.5"/>
  <polyline points="24,64 28,69 38,57" fill="none" stroke="#a6e3a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="46" y="59" width="48" height="10" rx="3" fill="#45475a"/>
  <!-- Line 3 - unchecked (active) -->
  <rect x="20" y="82" width="18" height="18" rx="4" fill="none" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="25" y="96" font-family="monospace" font-size="16" fill="#89b4fa" font-weight="bold">~</text>
  <rect x="46" y="86" width="56" height="10" rx="3" fill="#89b4fa" opacity="0.3"/>
  <!-- Cursor blink -->
  <rect x="48" y="84" width="2" height="14" rx="1" fill="#89b4fa">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
